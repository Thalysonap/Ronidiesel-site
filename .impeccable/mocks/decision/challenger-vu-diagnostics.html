<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;background:#141414;color:#f0e6cc;font-family:Geist,Arial,sans-serif}.desk{height:100%;padding:24px;display:grid;grid-template-rows:72px 1fr 300px;background:linear-gradient(#20201e,#111)}.nav{display:flex;align-items:center;border:1px solid #4f493e;padding:12px 24px}.brand{font:700 26px "Barlow Condensed",sans-serif;letter-spacing:.04em}.links{margin-left:auto;display:flex;gap:34px}.links a{color:inherit;text-decoration:none;font-size:14px}.hero{display:grid;grid-template-columns:8fr 4fr;align-items:end;padding:58px 24px 42px}.hero h1{max-width:880px;margin:0;font:600 82px/.92 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:-.02em}.hero p{margin:0 0 8px;padding:12px 0 12px 32px;border-left:1px solid #8c816f;font-size:18px;line-height:1.5;color:#cfc4ab}.meter-bank{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#4f3b2b;padding:18px}.meter{position:relative;overflow:hidden;background:#f0e6cc;color:#141414;border:8px solid #222;padding:25px 22px 18px}.arc{position:absolute;left:18%;right:18%;top:32px;height:120px;border:3px solid #1b1b1b;border-bottom:0;border-radius:180px 180px 0 0}.red{position:absolute;right:19%;top:36px;width:18%;height:12px;background:#a53a28}.needle{position:absolute;left:50%;top:145px;width:3px;height:100px;background:#111;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(24deg)}.meter:nth-child(2) .needle{transform:translate(-50%,-100%) rotate(-12deg)}.meter:nth-child(3) .needle{transform:translate(-50%,-100%) rotate(8deg)}.meter:nth-child(4) .needle{transform:translate(-50%,-100%) rotate(31deg)}.meter h2{position:absolute;bottom:18px;left:22px;margin:0;font:700 21px "Barlow Condensed",sans-serif;text-transform:uppercase}.cta{position:absolute;right:22px;bottom:16px;background:#141414;color:#f0e6cc;text-decoration:none;padding:10px 14px;font-size:12px;font-weight:700}
  </style>
</head>
<body><main class="desk"><nav class="nav"><div class="brand">RONIDIESEL</div><div class="links"><a href="#">Início</a><a href="#">Serviços</a><a href="#">Empresa</a></div></nav><section class="hero"><h1>Leia o problema. Resolva com precisão.</h1><p>Manutenção de veículos leves e pesados para quem precisa seguir trabalhando com confiança.</p></section><section class="meter-bank"><article class="meter"><div class="arc"></div><div class="red"></div><div class="needle"></div><h2>Motor</h2></article><article class="meter"><div class="arc"></div><div class="red"></div><div class="needle"></div><h2>Freios</h2></article><article class="meter"><div class="arc"></div><div class="red"></div><div class="needle"></div><h2>Elétrica</h2></article><article class="meter"><div class="arc"></div><div class="red"></div><div class="needle"></div><h2>Suspensão</h2><a class="cta" href="#">VER SERVIÇOS</a></article></section></main></body>
</html>
